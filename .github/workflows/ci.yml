name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capcraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: capcraft/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  web:
    name: Web lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capcraft/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capcraft/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
